backend:
  name: git-gateway
  branch: main

media_folder: src/assets/uploads
public_folder: /assets/uploads

collections:
  - name: posts
    label: Articles
    folder: src/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, time_format: false, date_format: YYYY-MM-DD }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: events
    label: Events
    folder: src/events
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title", "published"]
    fields:
      - { label: Title, name: title, widget: string }
      - label: Published
        name: published
        widget: boolean
        default: true
        hint: "Uncheck to hide this event. Only published events that have not ended are added to the site menu."
      - label: Event date
        name: date
        widget: datetime
        time_format: false
        date_format: YYYY-MM-DD
        hint: "The day the event happens. It stays in the menu through this date, or through the end date if you set one."
      - label: End date
        name: endDate
        widget: datetime
        time_format: false
        date_format: YYYY-MM-DD
        required: false
        hint: "Optional. For a multi-day event, the menu keeps it until this date."
      - { label: Time, name: time, widget: string, required: false, hint: "e.g. 7:00 PM" }
      - { label: Location, name: location, widget: string, required: false }
      - { label: Description, name: description, widget: string, required: false }
      - label: Body
        name: body
        widget: markdown
        hint: "Write the event like an article. Use the image control in the editor to upload photos into the page."

  - name: manual_videos
    label: Videos
    files:
      - name: manual_videos
        label: Video library
        file: src/_data/manualVideos.json
        format: json
        fields:
          - label: Videos (newest publish date shown first on the home page)
            name: videos
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Publish date, name: date, widget: datetime, time_format: false, date_format: YYYY-MM-DD, required: false, hint: "Used to sort videos; newest appear on the home page" }
              - { label: URL, name: url, widget: string, hint: "YouTube watch URL (youtube.com/watch?v=…)" }
              - { label: Thumbnail URL, name: thumbnail, widget: string, required: false }
              - { label: Duration, name: duration, widget: string, required: false, hint: "e.g. 5:30" }

  - name: schedule
    label: Service schedule
    files:
      - name: schedule
        label: Weekly services
        file: src/_data/schedule.json
        format: json
        fields:
          - label: Services
            name: services
            widget: list
            summary: "{{fields.title}} — {{fields.day}} {{fields.time}}"
            hint: "One entry per gathering. Times appear on the home page, footer, contact page, and visit page (in this order)."
            fields:
              - label: Icon
                name: icon
                widget: select
                options:
                  - { label: Sunday school (building), value: sundaySchool }
                  - { label: Memorial (clock), value: memorial }
                  - { label: Weekday Bible class (book), value: wednesdayClass }
              - { label: Title, name: title, widget: string }
              - { label: Day, name: day, widget: string, hint: "e.g. Sunday or Thursday — groups services on the contact page" }
              - { label: Time, name: time, widget: string, hint: "e.g. 9:30 - 10:30 AM (hero, visit page, contact)" }
              - { label: Short time (footer), name: footerTime, widget: string, required: false, hint: "Optional shorter line for the footer, e.g. 9:30 AM" }
              - { label: Home page description, name: description, widget: text, required: false, hint: "Shown on the home page service cards only. HTML links allowed." }
