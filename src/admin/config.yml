backend:
  name: git-gateway
  branch: main

media_folder: src/assets/uploads
public_folder: /assets/uploads

collections:
  - name: posts
    label: Articles
    folder: src/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, time_format: false, date_format: YYYY-MM-DD }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: manual_videos
    label: Videos
    files:
      - name: manual_videos
        label: Video library
        file: src/_data/manualVideos.json
        format: json
        fields:
          - label: Videos (newest publish date shown first on the home page)
            name: videos
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Publish date, name: date, widget: datetime, time_format: false, date_format: YYYY-MM-DD, required: false, hint: "Used to sort videos; newest appear on the home page" }
              - { label: URL, name: url, widget: string, hint: "YouTube watch or Shorts URL" }
              - { label: Thumbnail URL, name: thumbnail, widget: string, required: false }
              - { label: Duration, name: duration, widget: string, required: false, hint: "e.g. 5:30" }

  - name: schedule
    label: Service schedule
    files:
      - name: schedule
        label: Times & copy (home, footer, contact, visit times)
        file: src/_data/schedule.json
        format: json
        fields:
          - label: Home hero (compact schedule)
            name: heroSchedule
            widget: list
            summary: "{{fields.label}} {{fields.time}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Time, name: time, widget: string }
          - label: Home page service cards
            name: homepageServices
            widget: list
            fields:
              - label: Icon
                name: icon
                widget: select
                options:
                  - { label: Sunday school (building), value: sundaySchool }
                  - { label: Memorial (clock), value: memorial }
                  - { label: Wednesday class (book), value: wednesdayClass }
              - { label: Title, name: title, widget: string }
              - { label: Time line, name: timeLine, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Footer service times
            name: footerServiceTimes
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Time, name: time, widget: string }
          - label: Contact page
            name: contactServiceTimes
            widget: object
            fields:
              - { label: Sunday section heading, name: sundayHeading, widget: string }
              - label: Sunday rows
                name: sundayItems
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Time, name: time, widget: string }
              - { label: Wednesday section heading, name: wednesdayHeading, widget: string }
              - label: Wednesday rows
                name: wednesdayItems
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Time, name: time, widget: string }
          - label: "Visit page: time text (3 cards, top to bottom)"
            name: visitEventTimes
            widget: list
            field:
              label: Time range
              name: time
              widget: string
